[[mods]]
modId = "definitivtim_fanfare"
version = "0.4.0"
displayName = "DefinitivTim's Fanfare"
logoFile = "definitivtim_fanfare.png"
description = '''Lets each quest of FTB Quests choose the kind of its completion toast with a quest tag: toast_task, toast_goal or toast_challenge. Adds the quest task type Chapter Progress, which counts the completed quests of a chapter. Needed on the server and on every client once a quest uses Chapter Progress.'''
authors = "DefinitivTim"

