name: Sync GitHub Issues to Jira

# Legt bei jedem neuen GitHub-Issue automatisch ein passendes Jira-Issue im
# Projekt FAR (definitivtim.atlassian.net) an und kommentiert den Jira-Link
# zurueck ins GitHub-Issue. Gleiches Vorgehen wie im Repo DefinitivTim/farbound.
#
# Die Jira-Issues bekommen die Labels "github" und "fanfare", damit man sie in
# FAR von den Farbound-Issues und den anderen Mods unterscheiden kann.
# Die Antworten aus dem Issue-Formular landen gegliedert in der Beschreibung.
#
# Benoetigte Repo-Secrets (Settings -> Secrets and variables -> Actions):
#   JIRA_EMAIL      die Atlassian-Account-E-Mail von Tim
#   JIRA_API_TOKEN  API-Token von https://id.atlassian.com/manage-profile/security/api-tokens

on:
  issues:
    types: [opened]

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Jira-Payload aus dem Issue-Formular bauen
        id: payload
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import re

          title = os.environ["ISSUE_TITLE"]
          body = os.environ.get("ISSUE_BODY") or ""
          url = os.environ["ISSUE_URL"]
          gh_labels = [l.strip() for l in os.environ.get("ISSUE_LABELS", "").split(",") if l.strip()]

          # GitHub-Issue-Formulare rendern den Body als "### <Label>\n\n<Wert>\n\n..."
          sections = []
          parts = re.split(r"^### (.+)$", body, flags=re.MULTILINE)
          it = iter(parts[1:])
          for label, content in zip(it, it):
              value = content.strip()
              if value and value != "_No response_":
                  sections.append((label.strip(), value))

          fields = {
              "project": {"key": "FAR"},
              "summary": title,
              "issuetype": {"name": "Issue"},
              "labels": ["github", "fanfare"] + [re.sub(r"\s+", "-", l) for l in gh_labels],
          }

          description_lines = [f"GitHub Issue ({'Fanfare'}): {url}"]
          if sections:
              for label, value in sections:
                  # Logs ist ein Jira-URL-Feld: nur setzen, wenn es wirklich eine URL ist.
                  if label == "Logs" and re.match(r"^https?://\S+$", value):
                      fields["customfield_10051"] = value
                  description_lines += ["", f"h3. {label}", value]
          elif body.strip():
              description_lines += ["", body.strip()]

          fields["description"] = "\n".join(description_lines)

          with open("jira_payload.json", "w", encoding="utf-8") as f:
              json.dump({"fields": fields}, f, ensure_ascii=False)
          PYEOF

      - name: Jira-Issue anlegen
        id: create
        env:
          JIRA_BASE_URL: https://definitivtim.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail

          HTTP_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            --data @jira_payload.json \
            "$JIRA_BASE_URL/rest/api/2/issue")

          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Jira API Fehler ($HTTP_CODE): $BODY"
            exit 1
          fi

          JIRA_KEY=$(echo "$BODY" | jq -r '.key')
          echo "Erstellt: $JIRA_KEY"
          echo "jira_key=$JIRA_KEY" >> "$GITHUB_OUTPUT"

      - name: Jira-Link als Kommentar ins GitHub-Issue schreiben
        uses: actions/github-script@v7
        with:
          script: |
            const jiraKey = "${{ steps.create.outputs.jira_key }}";
            const jiraUrl = `https://definitivtim.atlassian.net/browse/${jiraKey}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Verknuepft mit Jira: [${jiraKey}](${jiraUrl})`
            });
